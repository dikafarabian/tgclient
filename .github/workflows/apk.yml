name: Build APK

on:
  workflow_dispatch:
    inputs:
      abi:
        description: ABI
        type: choice
        options:
          - arm64-v8a
          - x86_64
          - all
        default: arm64-v8a
      destination:
        description: Send to
        type: choice
        options:
          - private
          - community
        default: private

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-24.04
    outputs:
      abis: ${{ steps.abis.outputs.value }}

    steps:
      - name: Select ABIs
        id: abis
        env:
          ABI_INPUT: ${{ inputs.abi }}
        run: |
          if [ "$ABI_INPUT" = "all" ]; then
            echo 'value=["arm64-v8a","x86_64"]' >> "$GITHUB_OUTPUT"
          else
            echo "value=[\"$ABI_INPUT\"]" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.abi }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        abi: ${{ fromJSON(needs.prepare.outputs.abis) }}

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          submodules: recursive

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Point Chaquopy at Python
        run: echo "CHAQUOPY_BUILD_PYTHON=$(which python3.11 || which python)" >> "$GITHUB_ENV"

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2
        with:
          append-timestamp: true
          key: ${{ runner.os }}-ndk-27.2-${{ matrix.abi }}
          restore-keys: |
            ${{ runner.os }}-ndk-27.2-${{ matrix.abi }}
            ${{ runner.os }}-
          max-size: 5G
          verbose: 2
          save: true

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes nasm

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > TMessagesProj/google-services.json

      - name: Compute build info
        id: info
        run: bun scripts/ci/version.ts

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-cleanup: always

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: >-
            platforms;android-37.0
            build-tools;36.0.0
            cmake;3.31.6
            ndk;27.2.12479018

      - name: Write local.properties
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "TELEGRAM_APP_ID=$TELEGRAM_API_ID"
            echo "TELEGRAM_APP_HASH=$TELEGRAM_API_HASH"
          } > local.properties

      - name: Tune Gradle
        run: |
          echo 'org.gradle.jvmargs=-Xmx8192m -XX:MaxMetaspaceSize=2G -XX:+UseParallelGC -Dfile.encoding=UTF-8' >> ~/.gradle/gradle.properties
          echo 'kotlin.daemon.jvm.options=-Xmx2048m' >> ~/.gradle/gradle.properties

      - name: Reset ccache stats
        run: ccache -z

      - name: Build ${{ matrix.abi }}
        env:
          COMMIT_ID: ${{ github.sha }}
          NATIVE_TARGET: ${{ matrix.abi }}
          APK_NAME: ${{ matrix.abi == 'arm64-v8a' && steps.info.outputs.apk-arm64 || steps.info.outputs.apk-x64 }}
          CCACHE_COMPILERCHECK: content
          CCACHE_SLOPPINESS: time_macros,file_macro,include_file_mtime,include_file_ctime,locale,system_headers
          CCACHE_BASEDIR: ${{ github.workspace }}
        run: |
          export BUILD_TIMESTAMP=$(date +%s)
          ./gradlew --no-daemon :TMessagesProj:assembleRelease
          mkdir -p out
          apks=(TMessagesProj/build/outputs/apk/release/*.apk)
          [ "${#apks[@]}" -eq 1 ] || { ls -la TMessagesProj/build/outputs/apk/release >&2; exit 1; }
          cp "${apks[0]}" "out/$APK_NAME"

      - name: Show ccache stats
        if: always()
        run: ccache -s -v

      - name: Sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          umask 077
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          for apk in out/*.apk; do
            "$apksigner" sign \
              --ks "$RUNNER_TEMP/release.keystore" \
              --ks-type PKCS12 \
              --ks-key-alias lumine \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --key-pass "pass:$KEY_PASSWORD" \
              --v1-signing-enabled false \
              --in "$apk" \
              --out "$apk.signed"
            mv "$apk.signed" "$apk"
            "$apksigner" verify --print-certs "$apk"
          done
          rm -f "$RUNNER_TEMP/release.keystore"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apk-${{ matrix.abi }}
          path: out/*.apk
          retention-days: 1
          if-no-files-found: error

  post:
    name: Post
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@v2

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: apk-*
          merge-multiple: true
          path: out

      - name: Send to Telegram
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_PRIVATE_CHAT: ${{ vars.TELEGRAM_DM_CHAT_ID }}
          DESTINATION: ${{ inputs.destination }}
          TELEGRAM_ARTIFACT_URL: https://t.me/LuminaireCI/1391
          APK_DIR: out
        run: bash scripts/ci/upload.sh
